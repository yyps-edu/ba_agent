/* ============ 深色品牌主题（TradingAgents CN 风格统一） ============ */
:root {
 --bg-0: #f5f7fb;
 --bg-1: #ffffff;
 --bg-card: #ffffff;
 --bg-card-2: #f0f4fa;
 --border: #e3e8f0;
 --border-2: #d3dbe8;
 --text-1: #1f2937;
 --text-2: #5b6578;
 --text-3: #8792a6;
 --brand: #2b4c9e;
 --accent: #c4921a;
 --gold-soft: rgba(245,179,1,0.12);
 --green: #15803d;
 --red: #b91c1c;
 --purple: #6d28d9;
 --blue: #2b4c9e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg-0); color: var(--text-1); }
body {
 font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
 padding-top: 64px;
 line-height: 1.55;

}

/* ============ 顶部 Sticky 深色导航 ============ */
.q-nav {
 position: fixed; top: 0; left: 0; right: 0; z-index: 50;
 height: 64px;
 background: rgba(255,255,255,0.88);
 backdrop-filter: saturate(140%) blur(10px);
 -webkit-backdrop-filter: saturate(140%) blur(10px);
 border-bottom: 1px solid var(--border);
}
.q-nav-inner {
 max-width: 1700px; margin: 0 auto;
 padding: 0 24px; height: 100%;
 display: flex; align-items: center; gap: 28px;
}
.q-brand {
 display: inline-flex; align-items: center; gap: 10px;
 font-weight: 800; font-size: 17px; letter-spacing: 0.5px;
 color: var(--text-1); text-decoration: none;
}
.q-brand .logo {
 width: 26px; height: 26px; border-radius: 6px;
 display: grid; place-items: center;
 background: var(--brand);
 color: #fff; font-size: 14px; font-weight: 900;
}
.q-brand .gold { color: var(--gold); }
.q-nav-links { display: flex; gap: 18px; font-size: 13px; color: var(--text-2); }
.q-nav-links a { color: inherit; text-decoration: none; transition: color 0.2s ease; }
.q-nav-links a:hover { color: var(--brand); }
.q-nav-links a.active { color: var(--brand); font-weight: 600; }
.q-nav-spacer { flex: 1; }
.q-page-label {
 display: inline-flex; align-items: center; gap: 8px;
 color: var(--text-1); font-size: 14px; font-weight: 700;
 padding: 6px 12px;
 background: #eef2fa;
 border: 1px solid #dbe4f5;
 border-radius: 8px;
}
.q-page-label .emoji { font-size: 16px; }

.container { max-width: 1700px; margin: 0 auto; padding: 20px; }
/* 控件面板：替代旧紫色 Banner */
.header {
 background: var(--bg-card);
 color: var(--text-1);
 padding: 18px 28px;
 border-radius: 14px;
 border: 1px solid var(--border);
 margin-bottom: 20px;
 display: flex; justify-content: space-between; align-items: center;
 flex-wrap: wrap; gap: 16px;

}
.header h1 { font-size: 20px; color: var(--brand); letter-spacing: 0.5px; font-weight: 800; }
.header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-right select { background: var(--bg-1); color: var(--text-1); border: 1px solid var(--border-2); padding: 7px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; outline: none; white-space: nowrap; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.header-right select:hover { border-color: var(--brand); }
.adj-switch { display: inline-flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 14px; font-weight: 500; }
.adj-switch input { position: absolute; opacity: 0; pointer-events: none; }
.adj-switch .slider { position: relative; display: inline-block; width: 46px; height: 24px; background: #d8dee9; border-radius: 999px; cursor: pointer; transition: background 0.25s ease; }
.adj-switch .slider::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform 0.25s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
.adj-switch input:checked + .slider { background: var(--green); }
.adj-switch input:checked + .slider::after { transform: translateX(22px); }

/* ========== 两栏布局 ========== */
.main-layout { display: flex; gap: 20px; align-items: flex-start; }

/* ---------- 左栏：统计指标 ---------- */
.sidebar { flex: 0 0 300px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 84px; }
.panel { background: var(--bg-card); border-radius: 12px; padding: 18px; border: 1px solid var(--border); }
.panel-title { font-size: 15px; color: var(--text-1); margin-bottom: 14px; font-weight: 700; border-left: 4px solid var(--brand); padding-left: 10px; }
.stats-list { display: flex; flex-direction: column; gap: 10px; }
.stat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--bg-card-2); border-radius: 8px; border: 1px solid var(--border); }
.stat-item .label { color: var(--text-2); font-size: 13px; white-space: nowrap; }
.stat-item .value { font-size: 15px; font-weight: 700; white-space: nowrap; color: var(--accent); }
.stat-item .value.pos { color: var(--red); }
.stat-item .value.neg { color: var(--green); }

/* ---------- 右栏：图表 ---------- */
.main-content { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 20px; }
.chart-box { flex: 0 0 calc(50% - 10px); background: var(--bg-card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); overflow: hidden; min-width: 0; box-sizing: border-box; }
.chart-box.full { flex: 0 0 100%; }
.chart-title { font-size: 15px; color: var(--text-1); margin-bottom: 8px; font-weight: 700; border-left: 4px solid var(--brand); padding-left: 10px; }
.params-bar { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; padding: 6px 10px; background: var(--bg-card-2); border-radius: 8px; border: 1px solid var(--border); }
.param { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.param label { white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.param label span { color: var(--brand); font-weight: 700; min-width: 28px; text-align: center; }
.param input[type=range] { width: 100px; accent-color: var(--brand); cursor: pointer; }
.chart { width: 100%; height: 360px; }
.chart.tall { height: 420px; }

.footer { text-align: center; padding: 24px 20px 32px; color: var(--text-3); font-size: 13px; margin-top: 20px; border-top: 1px solid var(--border); }

@media (max-width: 1100px) {
 .main-layout { flex-direction: column; }
 .sidebar { position: static; flex: 0 0 auto; width: 100%; }
 .chart-box, .chart-box.full { flex: 0 0 100%; }
}
@media (max-width: 780px) {
 .q-nav-links { display: none; }
}
</style>

<script>
let curStock = Object.keys(DATA)[0];
let curAdj = 'nofq';
const charts = {};

// ---------- 技术指标计算 ----------
function ma(arr, n) {
 const r = new Array(arr.length).fill(null);
 let sum = 0;
 for (let i = 0; i < arr.length; i++) {
 sum += arr[i];
 if (i >= n) sum -= arr[i - n];
 if (i >= n - 1) r[i] = sum / n;
 }
 return r;
}
function ema(arr, n) {
 const r = new Array(arr.length).fill(null);
 const k = 2 / (n + 1);
 let prev = null;
 for (let i = 0; i < arr.length; i++) {
 if (prev === null) { prev = arr[i]; r[i] = prev; }
 else { prev = arr[i] * k + prev * (1 - k); r[i] = prev; }
 }
 return r;
}
function rsiCalc(arr, n) {
 const r = new Array(arr.length).fill(null);
 let gain = 0, loss = 0;
 for (let i = 1; i < arr.length; i++) {
 const d = arr[i] - arr[i - 1];
 const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
 if (i <= n) { gain += g; loss += l; if (i === n) { gain /= n; loss /= n; r[i] = 100 - 100 / (1 + gain / (loss || 1e-9)); } }
 else { gain = (gain * (n - 1) + g) / n; loss = (loss * (n - 1) + l) / n; r[i] = 100 - 100 / (1 + gain / (loss || 1e-9)); }
 }
 return r;
}
function macdCalc(arr, f, s, sig) {
 const ef = ema(arr, f), es = ema(arr, s);
 const dif = arr.map((_, i) => (ef[i] !== null && es[i] !== null) ? ef[i] - es[i] : null);
 const valid = dif.filter(v => v !== null);
 const deaValid = ema(valid, sig);
 const dea = new Array(arr.length).fill(null);
 let j = 0;
 for (let i = 0; i < dif.length; i++) { if (dif[i] !== null) { dea[i] = deaValid[j++]; } }
 const hist = dif.map((v, i) => (v !== null && dea[i] !== null) ? 2 * (v - dea[i]) : null);
 return { dif, dea, hist };
}
function boll(arr, n, mult) {
 const mid = ma(arr, n);
 const up = new Array(arr.length).fill(null), low = new Array(arr.length).fill(null);
 for (let i = n - 1; i < arr.length; i++) {
 let sum = 0;
 for (let j = i - n + 1; j <= i; j++) sum += (arr[j] - mid[i]) ** 2;
 const sd = Math.sqrt(sum / n);
 up[i] = mid[i] + mult * sd; low[i] = mid[i] - mult * sd;
 }
 return { up, mid, low };
}
function kdjCalc(ohlc, n) {
 const len = ohlc.length;
 const k = new Array(len).fill(null), d = new Array(len).fill(null), j = new Array(len).fill(null);
 let kv = 50, dv = 50;
 for (let i = 0; i < len; i++) {
 if (i < n - 1) continue;
 let ln = Infinity, hn = -Infinity;
 for (let x = i - n + 1; x <= i; x++) { ln = Math.min(ln, ohlc[x][2]); hn = Math.max(hn, ohlc[x][3]); }
 const rsv = hn === ln ? 0 : (ohlc[i][1] - ln) / (hn - ln) * 100;
 kv = 2 / 3 * kv + 1 / 3 * rsv;
 dv = 2 / 3 * dv + 1 / 3 * kv;
 k[i] = kv; d[i] = dv; j[i] = 3 * kv - 2 * dv;
 }
 return { k, d, j };
}

// ---------- 工具 ----------
function val(id) { return parseFloat(document.getElementById(id).value); }
function catAxis(dates) { return { type: 'category', data: dates, axisLabel: { formatter: v => v.slice(5) } }; }
function tip() { return { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;' }; }
const priceFmt = { axisLabel: { formatter: v => Number(v).toFixed(2) } };
const g = { left: 60, right: 80, bottom: 56, top: 30 };

// ---------- 渲染 ----------
function render() {
 const meta = DATA[curStock];
 const s = meta[curAdj];
 const dates = s.dates, ohlc = s.ohlc, close = s.close, vol = s.vol, pct = s.pct;
 const pMa = val('p-ma'), pMa2 = val('p-ma2'), pRsi = val('p-rsi');
 const pFast = val('p-fast'), pSlow = val('p-slow'), pSig = val('p-sig');
 const pBb = val('p-bb'), pBbm = val('p-bbm'), pKdj = val('p-kdj');

 // 统计指标
 const mean = pct.reduce((a, b) => a + b, 0) / pct.length;
 const std = Math.sqrt(pct.reduce((a, b) => a + (b - mean) ** 2, 0) / pct.length);
 const stats = [
 ['股票代码', meta.code],
 ['时间区间', dates[0].slice(2).replace(/-/g,'.') + ' ~ ' + dates[dates.length - 1].slice(2).replace(/-/g,'.')],
 ['最新收盘', close[close.length - 1].toFixed(2)],
 ['日均涨跌', mean.toFixed(4) + '%'],
 ['波动率', std.toFixed(4) + '%'],
 ['最大涨幅', '+' + Math.max(...pct).toFixed(2) + '%'],
 ['最大跌幅', Math.min(...pct).toFixed(2) + '%'],
 ];
 document.getElementById('stats').innerHTML = stats.map(([l, v]) =>
 `<div class="stat-item"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');

 // K线 + 收盘价 + 成交量
 charts.kline.setOption({
 tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;' },
 legend: { data: [
 '日K',
 '收盘价',
 '成交量'
 ], top: 0, textStyle: { fontSize: 12 } },
 axisPointer: { link: [{ xAxisIndex: 'all' }] },
 dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true }],
 grid: [
 { left: 60, right: 60, top: 30, bottom: '38%' },
 { left: 60, right: 60, top: '70%', bottom: 30 }
 ],
 xAxis: [
 { type: 'category', data: dates, gridIndex: 0, axisLabel: { show: false }, axisTick: { show: false } },
 { type: 'category', data: dates, gridIndex: 1, axisLabel: { formatter: v => v.slice(5) } }
 ],
 yAxis: [
 { scale: true, gridIndex: 0, splitNumber: 4, ...priceFmt },
 { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { formatter: v => v >= 10000 ? (v / 10000).toFixed(0) + '万' : v } }
 ],
 series: [
 { name: '日K', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0, data: ohlc, itemStyle: { color: '#ec0000', color0: '#00da3c', borderColor: '#8A0000', borderColor0: '#008F28' } },
 { name: '收盘价', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: close, smooth: true, showSymbol: false, symbol: 'none', itemStyle: { color: '#1f2937' }, lineStyle: { color: '#1f2937', width: 1.4 } },
 { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: vol, itemStyle: { color: (p) => ohlc[p.dataIndex][1] >= ohlc[p.dataIndex][0] ? '#ec0000' : '#00da3c' } }
 ]
 }, true);

 // 均线
 charts.ma.setOption({
 tooltip: tip(),
 legend: { data: [
 'MA' + pMa,
 'MA' + pMa2
 ], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: catAxis(dates), yAxis: { scale: true, ...priceFmt },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 series: [
 { name: 'MA' + pMa, type: 'line', data: ma(close, pMa), smooth: true, showSymbol: false, symbol: 'none', itemStyle: { color: '#2b4c9e' }, lineStyle: { color: '#2b4c9e', width: 2 } },
 { name: 'MA' + pMa2, type: 'line', data: ma(close, pMa2), smooth: true, showSymbol: false, symbol: 'none', itemStyle: { color: '#15803d' }, lineStyle: { color: '#15803d', width: 2 } }
 ]
 }, true);

 // 收盘价：不复权 + 前复权 对比
 const blockN = meta.nofq, blockQ = meta.qfq;
 const mapN = Object.fromEntries(blockN.dates.map((d, i) => [d, blockN.close[i]]));
 const shareDates = blockQ.dates.filter(d => Object.prototype.hasOwnProperty.call(mapN, d));
 const closeN = shareDates.map(d => mapN[d]);
 const closeQ = shareDates.map(d => blockQ.close[blockQ.dates.indexOf(d)]);
 const allClose = closeN.concat(closeQ);
 const firstN = closeN[0], firstQ = closeQ[0], lastN = closeN[closeN.length - 1], lastQ = closeQ[closeQ.length - 1];
 const avgGap = closeN.reduce((a, _, i) => a + Math.abs(closeQ[i] - closeN[i]), 0) / closeN.length;
 const latestPct = ((lastQ - lastN) / (lastN || 1) * 100).toFixed(3);
 charts.close.setOption({
 tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;',
 formatter: params => {
 const rows = params.map(p => `${p.marker}${p.seriesName}: ${Number(p.value).toFixed(2)}`).join('<br/>');
 if (params.length >= 2) {
 const diff = Number(params[1].value - params[0].value).toFixed(3);
 const pct = ((params[1].value - params[0].value) / (params[0].value || 1) * 100).toFixed(3);
 return `${params[0].axisValue}<br/>${rows}<br/><span style="color:#888">差额: ${diff} (${pct}%)</span>`;
 }
 return `${params[0].axisValue}<br/>${rows}`;
 }
 },
 legend: { data: [
 '不复权收盘',
 '前复权收盘'
 ], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: { type: 'category', data: shareDates, axisLabel: { formatter: v => v.slice(5) } },
 yAxis: { scale: true, min: Math.min(...allClose) * 0.98, max: Math.max(...allClose) * 1.02, ...priceFmt },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 graphic: [{ type: 'text', left: g.left + 8, top: 10, style: {
 text: `首差 ${((firstQ - firstN) / (firstN || 1) * 100).toFixed(3)}% 末差 ${latestPct}% 均差 ${avgGap.toFixed(3)}`,
 fill: '#5b6578', fontSize: 11, fontFamily: 'Microsoft YaHei'
 } }],
 series: [
 { name: '不复权收盘', type: 'line', data: closeN, smooth: true, showSymbol: false, symbol: 'none', itemStyle: { color: '#2b4c9e' }, lineStyle: { color: '#2b4c9e', width: 2.1 },
 areaStyle: { color: 'rgba(43,76,158,0.10)' } },
 { name: '前复权收盘', type: 'line', data: closeQ, smooth: true, showSymbol: false, symbol: 'none', itemStyle: { color: '#c4921a' }, lineStyle: { color: '#c4921a', width: 2 } }
 ]
 }, true);

 // 日涨跌幅度
 charts.dist.setOption({
 tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;', formatter: params => { const p=params[0]; return `${p.axisValue}<br/>涨跌: ${p.value.toFixed(2)}%`; } },
 legend: { data: ['日涨跌%'], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: catAxis(dates),
 yAxis: { name: '涨跌%', axisLabel: { formatter: v => v.toFixed(1) + '%' } },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 series: [
 { name: '日涨跌%', type: 'bar', data: pct, barWidth: '70%',
 itemStyle: { color: v => v.value >= 0 ? '#ec0000' : '#00da3c' },
 markLine: { silent: true, symbol: 'none', data: [{ yAxis: 0, lineStyle: { color: '#5b6578', type: 'solid' } }] } }
 ]
 }, true);

 // RSI
 const r = rsiCalc(close, pRsi);
 charts.rsi.setOption({
 tooltip: tip(), legend: { data: [
 'RSI'
 ], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: catAxis(dates), yAxis: { min: 0, max: 100 },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 series: [{ name: 'RSI', type: 'line', data: r, showSymbol: false, symbol: 'none', itemStyle: { color: '#6d28d9' }, lineStyle: { color: '#6d28d9', width: 2.1 }, markLine: { silent: true, symbol: 'none', data: [{ yAxis: 70, lineStyle: { color: '#b91c1c' }, label: { formatter: '超买70' } }, { yAxis: 30, lineStyle: { color: '#15803d' }, label: { formatter: '超卖30' } }] } }]
 }, true);

 // MACD
 const m = macdCalc(close, pFast, pSlow, pSig);
 charts.macd.setOption({
 tooltip: tip(), legend: { data: [
 'DIF',
 'DEA',
 'MACD柱'
 ], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: catAxis(dates), yAxis: { scale: true },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 series: [
 { name: 'DIF', type: 'line', data: m.dif, showSymbol: false, symbol: 'none', itemStyle: { color: '#2b4c9e' }, lineStyle: { color: '#2b4c9e', width: 2 } },
 { name: 'DEA', type: 'line', data: m.dea, showSymbol: false, symbol: 'none', itemStyle: { color: '#c4921a' }, lineStyle: { color: '#c4921a', width: 2 } },
 { name: 'MACD柱', type: 'bar', data: m.hist, itemStyle: { color: (p) => p.value >= 0 ? '#ec0000' : '#00da3c' } }
 ]
 }, true);

 // 布林带
 const b = boll(close, pBb, pBbm);
 charts.bb.setOption({
 tooltip: tip(), legend: { data: [
 '收盘价',
 '上轨',
 '中轨',
 '下轨'
 ], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: catAxis(dates), yAxis: { scale: true, ...priceFmt },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 series: [
 { name: '收盘价', type: 'line', data: close, showSymbol: false, symbol: 'none', itemStyle: { color: '#1f2937' }, lineStyle: { color: '#1f2937', width: 1.6 } },
 { name: '上轨', type: 'line', data: b.up, showSymbol: false, symbol: 'none', itemStyle: { color: '#b91c1c' }, lineStyle: { color: '#b91c1c', type: 'dashed', width: 1.6 } },
 { name: '中轨', type: 'line', data: b.mid, showSymbol: false, symbol: 'none', itemStyle: { color: '#c4921a' }, lineStyle: { color: '#c4921a', width: 1.8 } },
 { name: '下轨', type: 'line', data: b.low, showSymbol: false, symbol: 'none', itemStyle: { color: '#15803d' }, lineStyle: { color: '#15803d', type: 'dashed', width: 1.6 } }
 ]
 }, true);

 // KDJ
 const kd = kdjCalc(ohlc, pKdj);
 charts.kdj.setOption({
 tooltip: tip(), legend: { data: [
 'K',
 'D',
 'J'
 ], top: 0, textStyle: { fontSize: 12 } },
 grid: g,
 xAxis: catAxis(dates), yAxis: { scale: true },
 dataZoom: [{ type: 'inside', start: 0, end: 100 }],
 series: [
 { name: 'K', type: 'line', data: kd.k, showSymbol: false, symbol: 'none', itemStyle: { color: '#2b4c9e' }, lineStyle: { color: '#2b4c9e', width: 1.9 }, markLine: { silent: true, symbol: 'none', data: [{ yAxis: 80, lineStyle: { color: '#b91c1c' }, label: { formatter: '超买80' } }, { yAxis: 20, lineStyle: { color: '#15803d' }, label: { formatter: '超卖20' } }] } },
 { name: 'D', type: 'line', data: kd.d, showSymbol: false, symbol: 'none', itemStyle: { color: '#c4921a' }, lineStyle: { color: '#c4921a', width: 1.9 } },
 { name: 'J', type: 'line', data: kd.j, showSymbol: false, symbol: 'none', itemStyle: { color: '#6d28d9' }, lineStyle: { color: '#6d28d9', width: 1.9 } }
 ]
 }, true);
}

// ---------- 初始化 ----------
function init() {
 ['kline', 'ma', 'close', 'dist', 'rsi', 'macd', 'bb', 'kdj'].forEach(k => {
 charts[k] = echarts.init(document.getElementById('c-' + k));
 });
 const sel = document.getElementById('stockSelect');
 Object.keys(DATA).forEach(name => {
 const opt = document.createElement('option');
 opt.value = name;
 opt.textContent = name + ' (' + DATA[name].code + ')';
 if (name === curStock) opt.selected = true;
 sel.appendChild(opt);
 });
 sel.onchange = () => { curStock = sel.value; render(); };
 document.getElementById('adjToggle').addEventListener('change', e => {
 curAdj = e.target.checked ? 'qfq' : 'nofq';
 render();
 });
 const ids = ['ma', 'ma2', 'rsi', 'fast', 'slow', 'sig', 'bb', 'bbm', 'kdj'];
 ids.forEach(id => {
 const el = document.getElementById('p-' + id), lbl = document.getElementById('v-' + id);
 el.oninput = () => { lbl.textContent = id === 'bbm' ? parseFloat(el.value).toFixed(1) : el.value; render(); };
 });
 window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
 render();
}
init();
</script>
</body>
</html>
