<script>
let curStock = Object.keys(DATA)[0];
let curAdj = 'nofq';
const charts = {};

// ---------- 工具 ----------
function val(id) { return parseFloat(document.getElementById(id).value); }
function ma(arr, n) {
  const r = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= n) sum -= arr[i - n];
    if (i >= n - 1) r[i] = sum / n;
  }
  return r;
}

// ---------- 回测引擎 ----------
function backtest(close, dates, pShort, pLong, capital, feeRate, slipRate) {
  const n = close.length;
  const shortMA = ma(close, pShort);
  const longMA = ma(close, pLong);

  let cash = capital;
  let shares = 0;
  let position = 0;
  let entryPrice = 0;

  const equity = new Array(n).fill(0);
  const benchmark = new Array(n).fill(0);
  const drawdown = new Array(n).fill(0);
  const trades = [];
  const buySignals = [];
  const sellSignals = [];

  let peakEquity = capital;
  let wins = 0, totalTrades = 0;
  let dailyReturns = [];
  let prevEquity = capital;

  for (let i = 0; i < n; i++) {
    const price = close[i];
    benchmark[i] = (capital / close[0]) * price;

    if (shortMA[i] !== null && longMA[i] !== null && i > 0 && shortMA[i - 1] !== null && longMA[i - 1] !== null) {
      const goldenCross = shortMA[i - 1] <= longMA[i - 1] && shortMA[i] > longMA[i];
      const deathCross = shortMA[i - 1] >= longMA[i - 1] && shortMA[i] < longMA[i];

      if (goldenCross && position === 0) {
        const execPrice = price * (1 + slipRate / 100);
        const fee = cash * feeRate / 100;
        const investable = cash - fee;
        shares = Math.floor(investable / execPrice / 100) * 100;
        if (shares > 0) {
          const cost = shares * execPrice;
          const buyFee = cost * feeRate / 100;
          cash -= (cost + buyFee);
          position = 1;
          entryPrice = execPrice;
          buySignals.push({ idx: i, date: dates[i], price: price });
          trades.push({ type: '买入', date: dates[i], price: execPrice.toFixed(2), shares: shares, amount: cost.toFixed(2), fee: buyFee.toFixed(2) });
        }
      }

      if (deathCross && position === 1) {
        const execPrice = price * (1 - slipRate / 100);
        const revenue = shares * execPrice;
        const sellFee = revenue * feeRate / 100;
        cash += (revenue - sellFee);
        const cost = shares * entryPrice;
        if (revenue - sellFee > cost) wins++;
        totalTrades++;
        sellSignals.push({ idx: i, date: dates[i], price: price });
        trades.push({ type: '卖出', date: dates[i], price: execPrice.toFixed(2), shares: shares, amount: revenue.toFixed(2), fee: sellFee.toFixed(2) });
        shares = 0;
        position = 0;
      }
    }

    equity[i] = cash + shares * price;
    if (equity[i] > peakEquity) peakEquity = equity[i];
    drawdown[i] = (equity[i] - peakEquity) / peakEquity * 100;
    if (i > 0) dailyReturns.push((equity[i] - prevEquity) / prevEquity);
    prevEquity = equity[i];
  }

  if (position === 1 && n > 0) {
    const execPrice = close[n - 1];
    const revenue = shares * execPrice;
    const sellFee = revenue * feeRate / 100;
    cash += (revenue - sellFee);
    const cost = shares * entryPrice;
    if (revenue - sellFee > cost) wins++;
    totalTrades++;
    position = 0;
    shares = 0;
  }

  const finalEquity = cash + (position === 1 ? shares * close[n - 1] : 0);
  const totalReturn = (finalEquity - capital) / capital * 100;
  const benchReturn = (close[n - 1] - close[0]) / close[0] * 100;
  const days = n;
  const annualReturn = days > 0 ? (Math.pow(finalEquity / capital, 252 / days) - 1) * 100 : 0;
  const benchAnnual = days > 0 ? (Math.pow(close[n - 1] / close[0], 252 / days) - 1) * 100 : 0;
  const maxDrawdown = Math.min(...drawdown);

  const meanRet = dailyReturns.length > 0 ? dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length : 0;
  const stdRet = dailyReturns.length > 0 ? Math.sqrt(dailyReturns.reduce((a, b) => a + (b - meanRet) ** 2, 0) / dailyReturns.length) : 0;
  const sharpe = stdRet > 0 ? meanRet / stdRet * Math.sqrt(252) : 0;

  const benchReturns = [];
  for (let i = 1; i < n; i++) benchReturns.push((close[i] - close[i - 1]) / close[i - 1]);
  const benchMean = benchReturns.length > 0 ? benchReturns.reduce((s, v) => s + v, 0) / benchReturns.length : 0;
  const cov = dailyReturns.length > 0 ? dailyReturns.reduce((a, r, i) => a + (r - meanRet) * (benchReturns[i] - benchMean), 0) / dailyReturns.length : 0;
  const varB = benchReturns.length > 0 ? benchReturns.reduce((a, v) => a + (v - benchMean) ** 2, 0) / benchReturns.length : 0;
  const beta = varB > 0 ? cov / varB : 0;
  const alpha = annualReturn - beta * benchAnnual;
  const winRate = totalTrades > 0 ? wins / totalTrades * 100 : 0;

  return { equity, benchmark, drawdown, buySignals, sellSignals, trades, totalReturn, benchReturn, alpha, beta, maxDrawdown, sharpe, winRate, totalTrades, annualReturn, finalEquity, shortMA, longMA };
}

// ---------- 渲染 ----------
function render() {
  const meta = DATA[curStock];
  const s = meta[curAdj];
  const dates = s.dates, close = s.close;

  const pShort = val('p-short');
  const pLong = val('p-long');
  const capital = val('p-capital');
  const feeRate = val('p-fee');
  const slipRate = val('p-slip');

  const bt = backtest(close, dates, pShort, pLong, capital, feeRate, slipRate);

  // 统计指标
  const fmt = v => v >= 0 ? '+' + v.toFixed(2) + '%' : v.toFixed(2) + '%';
  const cls = v => v >= 0 ? 'pos' : 'neg';
  const stats = [
    ['策略总收益', fmt(bt.totalReturn), cls(bt.totalReturn)],
    ['基准总收益', fmt(bt.benchReturn), cls(bt.benchReturn)],
    ['超额收益(Alpha)', fmt(bt.alpha), cls(bt.alpha)],
    ['年化收益', fmt(bt.annualReturn), cls(bt.annualReturn)],
    ['最大回撤', bt.maxDrawdown.toFixed(2) + '%', 'neg'],
    ['Sharpe 比率', bt.sharpe.toFixed(3), 'neutral'],
    ['Beta', bt.beta.toFixed(3), 'neutral'],
    ['胜率', bt.winRate.toFixed(1) + '%', 'neutral'],
    ['交易次数', bt.totalTrades + ' 次', 'neutral'],
    ['期末资产', (bt.finalEquity / 10000).toFixed(2) + ' 万', 'neutral'],
  ];
  document.getElementById('stats').innerHTML = stats.map(([l, v, c]) =>
    `<div class="stat-item"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`).join('');

  // 资金曲线
  charts.equity.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;' },
    legend: { data: ['策略资金','基准(买入持有)'], top: 0, textStyle: { fontSize: 12 } },
    grid: { left: 70, right: 40, bottom: 56, top: 30 },
    xAxis: { type: 'category', data: dates, axisLabel: { formatter: v => v.slice(0, 7) } },
    yAxis: { scale: true, axisLabel: { formatter: v => (v / 10000).toFixed(1) + '万' } },
    dataZoom: [{ type: 'inside', start: 0, end: 100 }],
    series: [
      { name: '策略资金', type: 'line', data: bt.equity, showSymbol: false, symbol: 'none', lineStyle: { color: '#667eea', width: 2 }, itemStyle: { color: '#667eea' }, areaStyle: { opacity: 0.08 } },
      { name: '基准(买入持有)', type: 'line', data: bt.benchmark, showSymbol: false, symbol: 'none', lineStyle: { color: '#e67e22', width: 2, type: 'dashed' }, itemStyle: { color: '#e67e22' } }
    ]
  }, true);

  // 价格 + 均线 + 买卖信号
  const buyMarks = bt.buySignals.map(s => ({ coord: [s.date, s.price], value: '买', itemStyle: { color: '#e74c3c' } }));
  const sellMarks = bt.sellSignals.map(s => ({ coord: [s.date, s.price], value: '卖', itemStyle: { color: '#2ecc71' } }));
  charts.price.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;' },
    legend: { data: ['收盘价','MA'+pShort,'MA'+pLong], top: 0, textStyle: { fontSize: 12 } },
    grid: { left: 60, right: 60, bottom: 56, top: 30 },
    xAxis: { type: 'category', data: dates, axisLabel: { formatter: v => v.slice(0, 7) } },
    yAxis: { scale: true, axisLabel: { formatter: v => Number(v).toFixed(2) } },
    dataZoom: [{ type: 'inside', start: 0, end: 100 }],
    series: [
      { name: '收盘价', type: 'line', data: close, showSymbol: false, symbol: 'none', lineStyle: { color: '#333', width: 1 }, itemStyle: { color: '#333' },
        markPoint: { data: [...buyMarks, ...sellMarks], symbolSize: 28, label: { fontSize: 10, color: '#fff', fontWeight: 'bold' } } },
      { name: 'MA' + pShort, type: 'line', data: bt.shortMA, showSymbol: false, symbol: 'none', lineStyle: { color: '#e74c3c', width: 1.5 }, itemStyle: { color: '#e74c3c' } },
      { name: 'MA' + pLong, type: 'line', data: bt.longMA, showSymbol: false, symbol: 'none', lineStyle: { color: '#2ecc71', width: 1.5 }, itemStyle: { color: '#2ecc71' } }
    ]
  }, true);

  // 回撤曲线
  charts.drawdown.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'line' }, position: 'right', confine: true, extraCssText: 'z-index: 10;', formatter: params => `${params[0].axisValue}<br/>回撤: ${params[0].value.toFixed(2)}%` },
    legend: { data: ['回撤%'], top: 0, textStyle: { fontSize: 12 } },
    grid: { left: 60, right: 40, bottom: 56, top: 30 },
    xAxis: { type: 'category', data: dates, axisLabel: { formatter: v => v.slice(0, 7) } },
    yAxis: { axisLabel: { formatter: v => v + '%' } },
    dataZoom: [{ type: 'inside', start: 0, end: 100 }],
    series: [{ name: '回撤%', type: 'line', data: bt.drawdown, showSymbol: false, symbol: 'none', itemStyle: { color: '#e74c3c' }, lineStyle: { color: '#e74c3c', width: 1.5 }, areaStyle: { color: 'rgba(231,76,60,0.15)' } }]
  }, true);

  // 交易明细表
  const tbody = document.querySelector('#tradeTable tbody');
  tbody.innerHTML = bt.trades.map((t, i) =>
    `<tr><td>${i + 1}</td><td class="${t.type === '买入' ? 'buy-tag' : 'sell-tag'}">${t.type}</td><td>${t.date}</td><td>${t.price}</td><td>${t.shares}</td><td>${t.amount}</td><td>${t.fee}</td></tr>`
  ).join('');
}

// ---------- 初始化 ----------
function init() {
  const sel = document.getElementById('stockSelect');
  Object.keys(DATA).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = `${name} (${DATA[name].code})`;
    sel.appendChild(opt);
  });

  charts.equity = echarts.init(document.getElementById('c-equity'));
  charts.price = echarts.init(document.getElementById('c-price'));
  charts.drawdown = echarts.init(document.getElementById('c-drawdown'));

  sel.addEventListener('change', () => { curStock = sel.value; render(); });
  document.getElementById('adjToggle').addEventListener('change', e => { curAdj = e.target.checked ? 'qfq' : 'nofq'; render(); });

  const sliders = [['p-short', 'v-short'], ['p-long', 'v-long'], ['p-fee', 'v-fee'], ['p-slip', 'v-slip']];
  sliders.forEach(([pid, vid]) => {
    const el = document.getElementById(pid);
    el.addEventListener('input', () => { document.getElementById(vid).textContent = el.value; render(); });
  });
  document.getElementById('p-capital').addEventListener('input', render);

  window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));
  render();
}
init();
</script>
</body>
</html>
