<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票分析交互看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 24px 30px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.header h1 { font-size: 26px; }
.stock-tabs { display: flex; gap: 10px; }
.stock-tab { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); color: #fff; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 15px; transition: all .2s; }
.stock-tab.active { background: #fff; color: #667eea; font-weight: bold; }
.controls { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.controls h3 { color: #667eea; margin-bottom: 16px; font-size: 17px; }
.ctrl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px 28px; }
.ctrl-item { display: flex; flex-direction: column; gap: 6px; }
.ctrl-item label { font-size: 13px; color: #666; display: flex; justify-content: space-between; }
.ctrl-item label span { color: #667eea; font-weight: bold; }
.ctrl-item input[type=range] { width: 100%; accent-color: #667eea; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
.stat-card .label { color: #888; font-size: 13px; margin-bottom: 6px; }
.stat-card .value { font-size: 22px; font-weight: bold; color: #667eea; }
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.chart-box { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.chart-box.full { grid-column: 1 / -1; }
.chart-title { font-size: 15px; color: #333; margin-bottom: 8px; font-weight: bold; border-left: 4px solid #667eea; padding-left: 10px; }
.chart { width: 100%; height: 380px; }
.chart.tall { height: 440px; }
.footer { text-align: center; padding: 24px; color: #999; font-size: 13px; }
@media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📈 股票分析交互看板</h1>
    <div class="stock-tabs" id="tabs"></div>
  </div>

  <div class="stats-grid" id="stats"></div>

  <div class="controls">
    <h3>⚙️ 参数调节（实时刷新）</h3>
    <div class="ctrl-grid">
      <div class="ctrl-item"><label>MA 周期 <span id="v-ma">5</span></label><input type="range" id="p-ma" min="2" max="60" value="5"></div>
      <div class="ctrl-item"><label>MA2 周期 <span id="v-ma2">15</span></label><input type="range" id="p-ma2" min="2" max="60" value="15"></div>
      <div class="ctrl-item"><label>RSI 周期 <span id="v-rsi">14</span></label><input type="range" id="p-rsi" min="2" max="40" value="14"></div>
      <div class="ctrl-item"><label>MACD 快线 <span id="v-fast">12</span></label><input type="range" id="p-fast" min="2" max="30" value="12"></div>
      <div class="ctrl-item"><label>MACD 慢线 <span id="v-slow">26</span></label><input type="range" id="p-slow" min="3" max="50" value="26"></div>
      <div class="ctrl-item"><label>MACD 信号 <span id="v-sig">9</span></label><input type="range" id="p-sig" min="2" max="30" value="9"></div>
      <div class="ctrl-item"><label>布林带 周期 <span id="v-bb">20</span></label><input type="range" id="p-bb" min="5" max="40" value="20"></div>
      <div class="ctrl-item"><label>布林带 σ倍数 <span id="v-bbm">2.0</span></label><input type="range" id="p-bbm" min="1" max="3" step="0.1" value="2"></div>
      <div class="ctrl-item"><label>KDJ 周期 <span id="v-kdj">9</span></label><input type="range" id="p-kdj" min="3" max="30" value="9"></div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-box full"><div class="chart-title">K线图 + 均线（可缩放拖动）</div><div id="c-kline" class="chart tall"></div></div>
    <div class="chart-box full"><div class="chart-title">成交量</div><div id="c-vol" class="chart"></div></div>
    <div class="chart-box"><div class="chart-title">收盘价走势</div><div id="c-close" class="chart"></div></div>
    <div class="chart-box"><div class="chart-title">日收益率分布</div><div id="c-dist" class="chart"></div></div>
    <div class="chart-box"><div class="chart-title">RSI 指标</div><div id="c-rsi" class="chart"></div></div>
    <div class="chart-box"><div class="chart-title">MACD 指标</div><div id="c-macd" class="chart"></div></div>
    <div class="chart-box"><div class="chart-title">布林带</div><div id="c-bb" class="chart"></div></div>
    <div class="chart-box"><div class="chart-title">KDJ 指标</div><div id="c-kdj" class="chart"></div></div>
  </div>

  <div class="footer">© 2026 股票分析交互看板 | 数据来源：Tushare | 基于 ECharts</div>
</div>

<script src="data.js"></script>
<script>
let curStock = Object.keys(DATA)[0];
const charts = {};

// ---------- 技术指标计算 ----------
function ma(arr, n) {
  const r = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i];
    if (i >= n) sum -= arr[i - n];
    if (i >= n - 1) r[i] = sum / n;
  }
  return r;
}
function ema(arr, n) {
  const r = new Array(arr.length).fill(null);
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < arr.length; i++) {
    if (prev === null) { prev = arr[i]; r[i] = prev; }
    else { prev = arr[i] * k + prev * (1 - k); r[i] = prev; }
  }
  return r;
}
function rsiCalc(arr, n) {
  const r = new Array(arr.length).fill(null);
  let gain = 0, loss = 0;
  for (let i = 1; i < arr.length; i++) {
    const d = arr[i] - arr[i - 1];
    const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    if (i <= n) { gain += g; loss += l; if (i === n) { gain /= n; loss /= n; r[i] = 100 - 100 / (1 + gain / (loss || 1e-9)); } }
    else { gain = (gain * (n - 1) + g) / n; loss = (loss * (n - 1) + l) / n; r[i] = 100 - 100 / (1 + gain / (loss || 1e-9)); }
  }
  return r;
}
function macdCalc(arr, f, s, sig) {
  const ef = ema(arr, f), es = ema(arr, s);
  const dif = arr.map((_, i) => (ef[i] !== null && es[i] !== null) ? ef[i] - es[i] : null);
  const valid = dif.filter(v => v !== null);
  const deaValid = ema(valid, sig);
  const dea = new Array(arr.length).fill(null);
  let j = 0;
  for (let i = 0; i < dif.length; i++) { if (dif[i] !== null) { dea[i] = deaValid[j++]; } }
  const hist = dif.map((v, i) => (v !== null && dea[i] !== null) ? 2 * (v - dea[i]) : null);
  return { dif, dea, hist };
}
function boll(arr, n, mult) {
  const mid = ma(arr, n);
  const up = new Array(arr.length).fill(null), low = new Array(arr.length).fill(null);
  for (let i = n - 1; i < arr.length; i++) {
    let sum = 0;
    for (let j = i - n + 1; j <= i; j++) sum += (arr[j] - mid[i]) ** 2;
    const sd = Math.sqrt(sum / n);
    up[i] = mid[i] + mult * sd; low[i] = mid[i] - mult * sd;
  }
  return { up, mid, low };
}
function kdjCalc(ohlc, n) {
  const len = ohlc.length;
  const k = new Array(len).fill(null), d = new Array(len).fill(null), j = new Array(len).fill(null);
  let kv = 50, dv = 50;
  for (let i = 0; i < len; i++) {
    if (i < n - 1) continue;
    let ln = Infinity, hn = -Infinity;
    for (let x = i - n + 1; x <= i; x++) { ln = Math.min(ln, ohlc[x][2]); hn = Math.max(hn, ohlc[x][3]); }
    const rsv = hn === ln ? 0 : (ohlc[i][1] - ln) / (hn - ln) * 100;
    kv = 2 / 3 * kv + 1 / 3 * rsv;
    dv = 2 / 3 * dv + 1 / 3 * kv;
    k[i] = kv; d[i] = dv; j[i] = 3 * kv - 2 * dv;
  }
  return { k, d, j };
}

// ---------- 工具 ----------
function val(id) { return parseFloat(document.getElementById(id).value); }
function catAxis(dates) { return { type: 'category', data: dates, axisLabel: { formatter: v => v.slice(5) } }; }
function tip() { return { trigger: 'axis', axisPointer: { type: 'cross' } }; }

// ---------- 渲染 ----------
function render() {
  const s = DATA[curStock];
  const dates = s.dates, ohlc = s.ohlc, close = s.close, vol = s.vol, pct = s.pct;
  const pMa = val('p-ma'), pMa2 = val('p-ma2'), pRsi = val('p-rsi');
  const pFast = val('p-fast'), pSlow = val('p-slow'), pSig = val('p-sig');
  const pBb = val('p-bb'), pBbm = val('p-bbm'), pKdj = val('p-kdj');

  // 统计卡片
  const mean = pct.reduce((a, b) => a + b, 0) / pct.length;
  const std = Math.sqrt(pct.reduce((a, b) => a + (b - mean) ** 2, 0) / pct.length);
  const stats = [
    ['股票代码', s.code], ['数据天数', dates.length], ['区间', dates[0].slice(2) + '~' + dates[dates.length - 1].slice(2)],
    ['最新收盘', close[close.length - 1].toFixed(2)], ['日均涨跌(%)', mean.toFixed(4)],
    ['波动率(%)', std.toFixed(4)], ['最大涨幅(%)', Math.max(...pct).toFixed(2)], ['最大跌幅(%)', Math.min(...pct).toFixed(2)]
  ];
  document.getElementById('stats').innerHTML = stats.map(([l, v]) =>
    `<div class="stat-card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');

  // K线 + 均线
  charts.kline.setOption({
    tooltip: tip(), legend: { data: ['日K', 'MA' + pMa, 'MA' + pMa2], top: 0 },
    grid: { left: '6%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { scale: true },
    dataZoom: [{ type: 'inside', start: 55, end: 100 }, { type: 'slider', start: 55, end: 100 }],
    series: [
      { name: '日K', type: 'candlestick', data: ohlc, itemStyle: { color: '#ec0000', color0: '#00da3c', borderColor: '#8A0000', borderColor0: '#008F28' } },
      { name: 'MA' + pMa, type: 'line', data: ma(close, pMa), smooth: true, showSymbol: false, lineStyle: { width: 1.5 } },
      { name: 'MA' + pMa2, type: 'line', data: ma(close, pMa2), smooth: true, showSymbol: false, lineStyle: { width: 1.5 } }
    ]
  }, true);

  // 成交量
  charts.vol.setOption({
    tooltip: tip(), grid: { left: '6%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { scale: true },
    dataZoom: [{ type: 'inside', start: 55, end: 100 }, { type: 'slider', start: 55, end: 100 }],
    series: [{ name: '成交量', type: 'bar', data: vol, itemStyle: { color: (p) => ohlc[p.dataIndex][1] >= ohlc[p.dataIndex][0] ? '#ec0000' : '#00da3c' } }]
  }, true);

  // 收盘价
  charts.close.setOption({
    tooltip: tip(), grid: { left: '7%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { scale: true, min: Math.min(...close) * 0.98, max: Math.max(...close) * 1.02 },
    series: [{ name: '收盘价', type: 'line', data: close, smooth: true, showSymbol: false, lineStyle: { color: '#667eea', width: 2 }, areaStyle: { opacity: 0.08 } }]
  }, true);

  // 收益率分布
  const bins = 30, lo = Math.min(...pct), hi = Math.max(...pct), w = (hi - lo) / bins || 1;
  const hist = new Array(bins).fill(0), xData = [];
  for (let i = 0; i < bins; i++) { xData.push((lo + i * w).toFixed(2)); }
  pct.forEach(v => { hist[Math.min(bins - 1, Math.floor((v - lo) / w))]++; });
  charts.dist.setOption({
    tooltip: tip(), grid: { left: '7%', right: '4%', bottom: '14%' },
    xAxis: { type: 'category', data: xData, name: '涨跌%' }, yAxis: { name: '频数' },
    series: [{ type: 'bar', data: hist, itemStyle: { color: '#667eea' } }]
  }, true);

  // RSI
  const r = rsiCalc(close, pRsi);
  charts.rsi.setOption({
    tooltip: tip(), grid: { left: '7%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { min: 0, max: 100 },
    series: [{ name: 'RSI', type: 'line', data: r, showSymbol: false, lineStyle: { color: '#667eea', width: 2 }, markLine: { silent: true, symbol: 'none', data: [{ yAxis: 70, lineStyle: { color: '#e74c3c' }, label: { formatter: '超买70' } }, { yAxis: 30, lineStyle: { color: '#2ecc71' }, label: { formatter: '超卖30' } }] } }]
  }, true);

  // MACD
  const m = macdCalc(close, pFast, pSlow, pSig);
  charts.macd.setOption({
    tooltip: tip(), legend: { data: ['DIF', 'DEA'], top: 0 },
    grid: { left: '7%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { scale: true },
    series: [
      { name: 'DIF', type: 'line', data: m.dif, showSymbol: false, lineStyle: { color: '#3498db', width: 1.5 } },
      { name: 'DEA', type: 'line', data: m.dea, showSymbol: false, lineStyle: { color: '#e74c3c', width: 1.5 } },
      { name: 'MACD柱', type: 'bar', data: m.hist, itemStyle: { color: (p) => p.value >= 0 ? '#ec0000' : '#00da3c' } }
    ]
  }, true);

  // 布林带
  const b = boll(close, pBb, pBbm);
  charts.bb.setOption({
    tooltip: tip(), legend: { data: ['收盘价', '上轨', '中轨', '下轨'], top: 0 },
    grid: { left: '7%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { scale: true },
    series: [
      { name: '收盘价', type: 'line', data: close, showSymbol: false, lineStyle: { color: '#667eea', width: 2 } },
      { name: '上轨', type: 'line', data: b.up, showSymbol: false, lineStyle: { color: '#e74c3c', type: 'dashed' } },
      { name: '中轨', type: 'line', data: b.mid, showSymbol: false, lineStyle: { color: '#f39c12' } },
      { name: '下轨', type: 'line', data: b.low, showSymbol: false, lineStyle: { color: '#2ecc71', type: 'dashed' } }
    ]
  }, true);

  // KDJ
  const kd = kdjCalc(ohlc, pKdj);
  charts.kdj.setOption({
    tooltip: tip(), legend: { data: ['K', 'D', 'J'], top: 0 },
    grid: { left: '7%', right: '4%', bottom: '14%' },
    xAxis: catAxis(dates), yAxis: { scale: true },
    series: [
      { name: 'K', type: 'line', data: kd.k, showSymbol: false, lineStyle: { color: '#3498db', width: 1.5 }, markLine: { silent: true, symbol: 'none', data: [{ yAxis: 80, lineStyle: { color: '#e74c3c' }, label: { formatter: '超买80' } }, { yAxis: 20, lineStyle: { color: '#2ecc71' }, label: { formatter: '超卖20' } }] } },
      { name: 'D', type: 'line', data: kd.d, showSymbol: false, lineStyle: { color: '#e74c3c', width: 1.5 } },
      { name: 'J', type: 'line', data: kd.j, showSymbol: false, lineStyle: { color: '#2ecc71', width: 1.5 } }
    ]
  }, true);
}

// ---------- 初始化 ----------
function init() {
  ['kline', 'vol', 'close', 'dist', 'rsi', 'macd', 'bb', 'kdj'].forEach(k => {
    charts[k] = echarts.init(document.getElementById('c-' + k));
  });
  const tabs = document.getElementById('tabs');
  Object.keys(DATA).forEach(name => {
    const b = document.createElement('button');
    b.className = 'stock-tab' + (name === curStock ? ' active' : '');
    b.textContent = name + ' (' + DATA[name].code + ')';
    b.onclick = () => {
      curStock = name;
      document.querySelectorAll('.stock-tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    };
    tabs.appendChild(b);
  });
  const ids = ['ma', 'ma2', 'rsi', 'fast', 'slow', 'sig', 'bb', 'bbm', 'kdj'];
  ids.forEach(id => {
    const el = document.getElementById('p-' + id), lbl = document.getElementById('v-' + id);
    el.oninput = () => { lbl.textContent = id === 'bbm' ? parseFloat(el.value).toFixed(1) : el.value; render(); };
  });
  window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
  render();
}
init();
</script>
</body>
</html>
